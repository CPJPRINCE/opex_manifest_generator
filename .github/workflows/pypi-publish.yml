name: Publish Python distribution to PyPI and TestPyPi

on:
  push:
    tags:
      - '*'
    branches:
      - 'dev'
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'assets/**'
      - '.github/**'
  pull_request:
    branches: [master, dev]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'assets/**'
      - '.github/**'

jobs:
  verify-build-trigger:
    name: Verify Build Trigger
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check-ref.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch/tag rules
        id: check-ref
        run: |
          ref_type="${{ github.ref_type }}"
          ref_name="${{ github.ref_name }}"

          if [ "$ref_type" = "branch" ] && [ "$ref_name" = "dev" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Build enabled for push to dev."
            exit 0
          fi

          if [ "$ref_type" = "tag" ]; then
            if [[ "$ref_name" == v* ]]; then
              git fetch origin master --depth=1
              if git merge-base --is-ancestor "$GITHUB_SHA" "origin/master"; then
                echo "should_build=true" >> "$GITHUB_OUTPUT"
                echo "Build enabled for v* tag on master."
              else
                echo "should_build=false" >> "$GITHUB_OUTPUT"
                echo "Tag $ref_name matches v* but is not on master; skipping build."
              fi
            else
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              echo "Build enabled for non-v* tag: $ref_name"
            fi
            exit 0
          fi

          echo "should_build=false" >> "$GITHUB_OUTPUT"
          echo "Unsupported ref type/rule; skipping build."

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: verify-build-trigger
    if: needs.verify-build-trigger.outputs.should_build == 'true'

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.x"
    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v5
      with:
        name: python-package-distributions
        path: dist/

  publish-to-testpypi:
    name: >-
      Publish Python distribution to TestPyPI
    needs:
    - verify-build-trigger
    - build
    if: needs.verify-build-trigger.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/opex_manifest_generator
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v6
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: >-
      Publish Python distribution to PyPI
    needs:
    - build
    - verify-build-trigger
    if: needs.verify-build-trigger.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/opex_manifest_generator  # Replace <package-name> with your PyPI project name
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v6
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
